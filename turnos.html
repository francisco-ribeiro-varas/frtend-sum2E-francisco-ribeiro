<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/turnos.css">

</head>
<body>
    
    <div class="trust-indicators">
        <p><strong>50+</strong> Especialidades</p>
        <p><strong>20+</strong> Años de Experiencia</p>
        <p><strong>10,000+</strong> Pacientes Atendidos</p>
    </div>
    
    <button onclick="window.location.href='index.html'">Volver</button>
    
    <!--Formulario para solicitar turnos-->
    <h1>Solicitar Turno</h1>
    <form action="submit_turno.php" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" required><br><br>

        <label for="dni">DNI:</label>
        <input type="text" id="dni" name="dni" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required><br><br>

        <label for="fecha de nacimiento">Fecha de Nacimiento:</label>
        <input type="date" id="fecha de nacimiento" name="fecha de nacimiento" required><br><br>
        <label for="genero">Género:</label>
        <select id="genero" name="genero" required>
            <option value="">Seleccione un género</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
            <option value="otro">Otro</option>
            <option value="prefiero no decirlo">Prefiero no especificar</option>
        </select><br><br>


        <label for="especialidad">Especialidad:</label>
        <select id="especialidad" name="especialidad" required>
            <option value="">Seleccione una especialidad</option>
            <option value="clinica_general">Clínica General</option>
            <option value="cardiologia">Cardiología</option>
            <option value="pediatria">Pediatría</option>
            <option value="ginecologia">Ginecología</option>
            <option value="traumatologia">Traumatología</option>
            <option value="neurologia">Neurología</option>
        </select><br><br>
        
        <label for="medico">Médico:</label>
        <select id="medico" name="medico" required>
            <option value="">Seleccione un médico</option>
            <option value="dr_sanchez">Dr. Sánchez</option>
            <option value="dra_gomez">Dra. Gómez</option>
            <option value="dr_fernandez">Dr. Fernández</option>
            <option value="dra_lopez">Dra. López</option>
            <option value="dr_martinez">Dr. Martínez</option>
            <option value="dra_rodriguez">Dra. Rodríguez</option>
            <option value="dr_garcia">Dr. García</option>
            <option value="dra_perez">Dra. Pérez</option>
            <option value="dr_fernandez">Dr. Fernández</option>
            <option value="dra_gomez">Dra. Gómez</option>
            <option value="dr_sanchez">Dr. Sánchez</option>
            <option value="dra_lopez">Dra. López</option>
        </select><br><br>

        <label for="tipo de consulta">Tipo de Consulta:</label>
        <select id="tipo de consulta" name="tipo de consulta" required>
            <option value="">Seleccione un tipo de consulta</option>
            <option value="primera consulta">Primera Consulta</option>
            <option value="control">Control</option>
            <option value="resultados de estudios">Resultados de estudios</option>
        </select><br><br>

        <label for="fecha">Fecha del turno:</label>
        <input type="date" id="fecha" name="fecha" required><br><br>

        <label for="hora">Hora del turno:</label>
        <input type="time" id="hora" name="hora" required><br><br>

        <label for="modalidad">Modalidad:</label>
        <select id="modalidad" name="modalidad" required>
            <option value="">Seleccione una modalidad</option>
            <option value="presencial">Presencial</option>
            <option value="videoconsulta">Videoconsulta</option>
        </select><br><br>

        <input type="submit" value="Solicitar Turno">
        <input type="reset" value="Limpiar Formulario">
    </form>

</body>
</html>
