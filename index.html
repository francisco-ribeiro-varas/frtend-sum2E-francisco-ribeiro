<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>SaludPlus</title>
</head>
<body>
    
    <img src="imagenes/logo.jpg" alt="Logo SaludPlus">
    <header>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Especialidades</a></li>
                <li><a href="#">Médicos</a></li>
                <li><a href="#">Obras Sociales</a></li>
                <li><a href="#">Contactos</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Bienvenido a SaludPlus</h1>
            <p>Tu salud, nuestra prioridad.</p>
        </section>

        <section class="services">
            <h2>Nuestras Especialidades</h2>
            <div class="service-card">
                <img src="imagenes/cardiologia.png" alt="Cardiología">
                <h3>Cardiología</h3>
                <p>Atención especializada para tu corazón.</p>
            </div>
            <div class="service-card">
                <img src="imagenes/dermatologia.png" alt="Dermatología">
                <h3>Dermatología</h3>
                <p>Cuidado experto para tu piel.</p>
            </div>
            <div class="service-card">
                <img src="imagenes/pediatria.png" alt="Pediatría">
                <h3>Pediatría</h3>
                <p>Atención integral para tus hijos.</p>
            </div>
        </section>
    </main>
    <!--boton para solicitar turnos y que se diriga a turnos.html-->
    <button onclick="window.location.href='turnos.html'">Solicitar Turno</button>
</body>
</html>
